[package]
name = "glurmo-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "glurmo's web view, compiled to wasm and served by `glurmo serve`"
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
glurmo-model.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DataTransfer",
    "DragEvent",
    "HtmlCollection",
    "HtmlElement",
    "PointerEvent",
    "RequestRedirect",
    "ResponseType",
    "Storage",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "FontFaceSet",
    "Element",
    "EventSource",
    "Event",
    "EventSourceInit",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlStyleElement",
    "KeyboardEvent",
    "MouseEvent",
    "Location",
    "TextMetrics",
    "MessageEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "UrlSearchParams",
    "VisualViewport",
    "Window",
    "console",
] }

[lints]
workspace = true
