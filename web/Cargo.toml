[package]
name = "rtviz-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "rtviz's web view, compiled to wasm and served by `rtviz serve`"
publish = false

[dependencies]
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
rtviz-model = { path = "../model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "EventSource",
    "HtmlCanvasElement",
    "HtmlStyleElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "UrlSearchParams",
    "Window",
    "console",
] }

[lints]
workspace = true
