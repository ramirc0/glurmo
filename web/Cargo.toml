[package]
name = "glurmo-web"
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
description = "glurmo's web view, compiled to wasm and served by `glurmo serve`"
publish = false
license = "GPL-2.0-or-later"
repository = "https://github.com/ramirc0/glurmo"

[dependencies]
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
glurmo-model = { path = "../model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DataTransfer",
    "DragEvent",
    "HtmlCollection",
    "HtmlElement",
    "PointerEvent",
    "Storage",
    "Document",
    "DomRect",
    "DomRectReadOnly",
    "FontFaceSet",
    "Element",
    "EventSource",
    "Event",
    "EventSourceInit",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlStyleElement",
    "KeyboardEvent",
    "MouseEvent",
    "Location",
    "TextMetrics",
    "MessageEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "UrlSearchParams",
    "VisualViewport",
    "Window",
    "console",
] }

[lints]
workspace = true
