# The edge in front of the tunnel to `glurmo serve`. The image loads this file inside its `http` block.

proxy_cache_path /var/cache/nginx/glurmo levels=1:2 keys_zone=glurmo:1m max_size=100m inactive=30d use_temp_path=off;

# `resolve` asks Docker's resolver for the tunnel again and again. nginx then starts without the tunnel and
# follows it to a new address. It waits `resolver_timeout` after a failed lookup, 30 s unless set.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
upstream glurmo {
    zone upstream 64k;
    server tunnel:8765 resolve;
}

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/wasm text/css text/javascript image/svg+xml;

    # The page. glurmo is asked for it again after a second. When it does not answer, the last copy goes out.
    location / {
        limit_except GET { deny all; }
        proxy_pass http://glurmo;
        proxy_cache glurmo;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 200 1s;
        proxy_cache_use_stale error timeout http_502 http_503 http_504;
    }

    # Trunk puts a hash of each of these files in its name, so a name's content does not change.
    location ~ "-[0-9a-f]{16}(_bg)?\.(js|wasm|css|svg)$" {
        limit_except GET { deny all; }
        proxy_pass http://glurmo;
        proxy_cache glurmo;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The fonts keep their names from one build to the next.
    location /fonts/ {
        limit_except GET { deny all; }
        proxy_pass http://glurmo;
        proxy_cache glurmo;
        proxy_ignore_headers Cache-Control;
        proxy_hide_header Cache-Control;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://glurmo;
    }

    # The live stream. Buffering would hold its events back.
    location = /api/events {
        limit_except GET { deny all; }
        proxy_pass http://glurmo;
        proxy_buffering off;
    }

    location = /api/ron {
        limit_except POST { deny all; }
        proxy_pass http://glurmo;
    }
}
