[package]
name = "glurmo-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A client for Slurm's RPC protocol, as glurmo speaks it to slurmctld and slurmdbd"
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["io-util", "net", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
