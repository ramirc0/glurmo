[package]
name = "rtviz"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Live view of who holds which cores and GPUs on a batch-scheduler cluster"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "time", "rt", "macros"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dev-dependencies]
tempfile = "3.27.0"
