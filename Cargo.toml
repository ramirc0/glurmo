[package]
name = "glurmo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Live view of who holds which cores and GPUs on a batch-scheduler cluster"
publish.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors = ["Christian Ramirez <christian.ramirez1@umassmed.edu>"]

[dependencies]
glurmo-model.workspace = true
glurmo-rpc.workspace = true
anyhow.workspace = true
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
jiff = { version = "0.2.40", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
postgres = "0.19.14"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
ron.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
rustix = { version = "1", features = ["stdio"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "time", "rt", "macros", "sync", "rt-multi-thread", "net", "signal", "io-util"] }
tokio-stream = "0.1.19"
rust-embed = "8.13.0"
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "tracing-log"] }

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
ruzstd = "0.9.1"
tokio = { workspace = true, features = ["io-util", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace]
members = ["model", "rpc", "web"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
publish = false
license = "GPL-2.0-or-later"
repository = "https://github.com/ramirc0/glurmo"

[workspace.dependencies]
glurmo-model = { path = "model" }
glurmo-rpc = { path = "rpc" }
anyhow = "1.0.104"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = "1.54.1"
tracing = "0.1.44"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
