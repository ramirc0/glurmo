[package]
name = "rtviz"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Live view of who holds which cores and GPUs on a batch-scheduler cluster"
publish = false

[dependencies]
rtviz-model = { path = "model" }
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
jiff = { version = "0.2.40", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
ron = "0.12.3"
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
rustix = { version = "1", features = ["stdio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "time", "rt", "macros", "sync", "rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1.19"

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
ruzstd = "0.9.1"
tokio = { version = "1.54.1", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace]
members = ["model"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
